name: Architecture & V&V Guardrails CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "packet/**", "wp/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify-guardrails:
    name: Gate V1 Linter, Manifest (463 Packets / 833 Files) & Tier 0 Slicer V&V
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Repository Bootstrap & V&V Self-Tests
        run: ./scripts/bootstrap_repo.sh

      - name: Verify Phase 1 Translation Packets Integrity
        run: |
          for pkt in packets/phase1/PKT-001_crc.md packets/phase1/PKT-002_RandomValue.md packets/phase1/PKT-003_ExperienceTracker.md; do
            if [[ ! -s "$pkt" ]]; then
              echo "ERROR: Missing or empty Phase 1 packet: $pkt" >&2
              exit 1
            fi
            echo "Verified Phase 1 packet: $pkt ($(wc -c < "$pkt") bytes)"
          done
