name: Cross-Platform Architecture & V&V Guardrails CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "packet/**", "wp/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify-guardrails:
    name: "Gate V1 Linter, Manifest & Tier 0 Slicer V&V (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Checkout repository (LF preserved via .gitattributes)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Manifest, Tier 0 Slicer & Gate V1 Linter V&V Test Suites (Cross-Platform Python)
        run: |
          python scripts/validate_manifest.py
          python scripts/test_prep_packet.py
          python scripts/test_lint_determinism.py
          python scripts/lint_determinism.py

      - name: Run Full POSIX Repository Bootstrap & Git Hook V&V (Linux & macOS)
        if: runner.os != 'Windows'
        run: ./scripts/bootstrap_repo.sh

      - name: Verify Phase 1 Translation Packets Integrity (All OSes)
        shell: bash
        run: |
          for pkt in packets/phase1/PKT-001_crc.md packets/phase1/PKT-002_RandomValue.md packets/phase1/PKT-003_ExperienceTracker.md; do
            if [[ ! -s "$pkt" ]]; then
              echo "ERROR: Missing or empty Phase 1 packet: $pkt" >&2
              exit 1
            fi
            echo "Verified Phase 1 packet on ${{ runner.os }}: $pkt ($(wc -c < "$pkt") bytes)"
          done
